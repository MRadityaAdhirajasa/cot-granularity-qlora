<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 714" role="img" aria-label="Alur eksperimen CoT distillation granularity di bawah QLoRA. Dataset GSM8K disubsample menjadi 1.455 soal train dan 300 soal test. Teacher Kimi K3 menghasilkan tiga tingkat kerincian rationale per soal, membentuk empat varian data training yang hanya berbeda panjang rationale-nya. Student Qwen3-0.6B dan 1.7B dilatih dengan QLoRA menjadi 14 adapter. Jalur terpisah mengevaluasi kedua student with no training at all sebagai baseline. Keduanya dinilai pada 300 soal test yang sama dengan exact match jawaban numerik."><defs><marker id="an" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#898781"/></marker><marker id="ac" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#eb6834"/></marker><marker id="ai" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2a78d6"/></marker></defs><rect width="880" height="714" fill="#fcfcfb"/><text x="440.0" y="34" font-size="16" fill="#0b0b0b" text-anchor="middle" font-weight="600" font-family="system-ui,-apple-system,Segoe UI,sans-serif">Experiment pipeline: CoT distillation granularity under QLoRA</text><text x="440.0" y="54" font-size="12" fill="#898781" text-anchor="middle" font-weight="normal" font-family="system-ui,-apple-system,Segoe UI,sans-serif">does a more detailed rationale produce a more accurate student?</text><rect x="70" y="74" width="740" height="58" rx="6" fill="#ffffff" stroke="#c3c2b7" stroke-width="1.5"/><text x="440.0" y="98" font-size="15" fill="#0b0b0b" text-anchor="middle" font-weight="600" font-family="system-ui,-apple-system,Segoe UI,sans-serif">Dataset: GSM8K (Grade School Math 8K)</text><text x="440.0" y="118" font-size="12" fill="#52514e" text-anchor="middle" font-weight="normal" font-family="system-ui,-apple-system,Segoe UI,sans-serif">grade school math word problems with numeric answers  ·  1,455 train  ·  300 test</text><line x1="250.0" y1="132" x2="250.0" y2="164" stroke="#898781" stroke-width="1.6" marker-end="url(#an)"/><line x1="655.0" y1="132" x2="655.0" y2="164" stroke="#898781" stroke-width="1.6" marker-end="url(#an)"/><rect x="70" y="166" width="360" height="74" rx="6" fill="#ffffff" stroke="#c3c2b7" stroke-width="1.5"/><text x="250.0" y="189" font-size="14" fill="#0b0b0b" text-anchor="middle" font-weight="600" font-family="system-ui,-apple-system,Segoe UI,sans-serif">Teacher: Kimi K3</text><text x="250.0" y="208" font-size="12" fill="#52514e" text-anchor="middle" font-weight="normal" font-family="system-ui,-apple-system,Segoe UI,sans-serif">one call per problem, producing</text><text x="250.0" y="224" font-size="12" fill="#52514e" text-anchor="middle" font-weight="normal" font-family="system-ui,-apple-system,Segoe UI,sans-serif">all three detail levels at once</text><line x1="250.0" y1="240" x2="250.0" y2="272" stroke="#898781" stroke-width="1.6" marker-end="url(#an)"/><rect x="70" y="274" width="360" height="152" rx="6" fill="#eef4fd" stroke="#2a78d6" stroke-width="1.5"/><text x="250.0" y="296" font-size="13.5" fill="#2a78d6" text-anchor="middle" font-weight="600" font-family="system-ui,-apple-system,Segoe UI,sans-serif">Four training variants</text><text x="250.0" y="314" font-size="11.5" fill="#52514e" text-anchor="middle" font-weight="normal" font-family="system-ui,-apple-system,Segoe UI,sans-serif">same problems, same final answers;</text><text x="250.0" y="329" font-size="11.5" fill="#52514e" text-anchor="middle" font-weight="normal" font-family="system-ui,-apple-system,Segoe UI,sans-serif">only the rationale length differs</text><rect x="81" y="338" width="76" height="58" rx="6" fill="#ffffff" stroke="#2a78d6" stroke-width="1.5"/><text x="119" y="357" font-size="13" fill="#2a78d6" text-anchor="middle" font-weight="600" font-family="system-ui,-apple-system,Segoe UI,sans-serif">G1</text><text x="119" y="372" font-size="10" fill="#52514e" text-anchor="middle" font-weight="normal" font-family="system-ui,-apple-system,Segoe UI,sans-serif">terse</text><text x="119" y="387" font-size="10" fill="#898781" text-anchor="middle" font-weight="normal" font-family="system-ui,-apple-system,Segoe UI,sans-serif">33 tok</text><rect x="168" y="338" width="76" height="58" rx="6" fill="#ffffff" stroke="#2a78d6" stroke-width="1.5"/><text x="206" y="357" font-size="13" fill="#2a78d6" text-anchor="middle" font-weight="600" font-family="system-ui,-apple-system,Segoe UI,sans-serif">G2</text><text x="206" y="372" font-size="10" fill="#52514e" text-anchor="middle" font-weight="normal" font-family="system-ui,-apple-system,Segoe UI,sans-serif">moderate</text><text x="206" y="387" font-size="10" fill="#898781" text-anchor="middle" font-weight="normal" font-family="system-ui,-apple-system,Segoe UI,sans-serif">85 tok</text><rect x="255" y="338" width="76" height="58" rx="6" fill="#ffffff" stroke="#2a78d6" stroke-width="1.5"/><text x="293" y="357" font-size="13" fill="#2a78d6" text-anchor="middle" font-weight="600" font-family="system-ui,-apple-system,Segoe UI,sans-serif">G3</text><text x="293" y="372" font-size="10" fill="#52514e" text-anchor="middle" font-weight="normal" font-family="system-ui,-apple-system,Segoe UI,sans-serif">verbose</text><text x="293" y="387" font-size="10" fill="#898781" text-anchor="middle" font-weight="normal" font-family="system-ui,-apple-system,Segoe UI,sans-serif">338 tok</text><rect x="342" y="338" width="76" height="58" rx="6" fill="#ffffff" stroke="#2a78d6" stroke-width="1.5"/><text x="380" y="357" font-size="13" fill="#2a78d6" text-anchor="middle" font-weight="600" font-family="system-ui,-apple-system,Segoe UI,sans-serif">AO</text><text x="380" y="372" font-size="10" fill="#52514e" text-anchor="middle" font-weight="normal" font-family="system-ui,-apple-system,Segoe UI,sans-serif">no CoT</text><text x="380" y="387" font-size="10" fill="#898781" text-anchor="middle" font-weight="normal" font-family="system-ui,-apple-system,Segoe UI,sans-serif">0 tok</text><text x="250.0" y="414" font-size="11" fill="#898781" text-anchor="middle" font-weight="normal" font-family="system-ui,-apple-system,Segoe UI,sans-serif">rationale = step-by-step working shown before the answer</text><line x1="250.0" y1="426" x2="250.0" y2="458" stroke="#2a78d6" stroke-width="1.6" marker-end="url(#ai)"/><rect x="70" y="460" width="360" height="80" rx="6" fill="#ffffff" stroke="#c3c2b7" stroke-width="1.5"/><text x="250.0" y="483" font-size="13" fill="#0b0b0b" text-anchor="middle" font-weight="600" font-family="system-ui,-apple-system,Segoe UI,sans-serif">Student models: Qwen3-0.6B &amp;amp; Qwen3-1.7B</text><text x="250.0" y="502" font-size="11.5" fill="#52514e" text-anchor="middle" font-weight="normal" font-family="system-ui,-apple-system,Segoe UI,sans-serif">small models trained on the teacher's rationales</text><text x="250.0" y="522" font-size="12" fill="#52514e" text-anchor="middle" font-weight="normal" font-family="system-ui,-apple-system,Segoe UI,sans-serif">QLoRA r=16 · 3 epochs · 2 seeds  →  14 runs</text><line x1="250.0" y1="540" x2="250.0" y2="588" stroke="#2a78d6" stroke-width="1.6" marker-end="url(#ai)"/><rect x="500" y="166" width="310" height="74" rx="6" fill="#fdefe9" stroke="#eb6834" stroke-width="1.5"/><text x="655.0" y="189" font-size="14" fill="#eb6834" text-anchor="middle" font-weight="600" font-family="system-ui,-apple-system,Segoe UI,sans-serif">Pre-distillation baseline</text><text x="655.0" y="208" font-size="12" fill="#52514e" text-anchor="middle" font-weight="normal" font-family="system-ui,-apple-system,Segoe UI,sans-serif">the same student models,</text><text x="655.0" y="224" font-size="12" fill="#52514e" text-anchor="middle" font-weight="normal" font-family="system-ui,-apple-system,Segoe UI,sans-serif">with no training at all</text><line x1="655.0" y1="240" x2="655.0" y2="588" stroke="#eb6834" stroke-width="1.6" marker-end="url(#ac)"/><text x="667.0" y="316" font-size="12" fill="#eb6834" text-anchor="start" font-weight="normal" font-family="system-ui,-apple-system,Segoe UI,sans-serif">4-shot prompt, format</text><text x="667.0" y="333" font-size="12" fill="#eb6834" text-anchor="start" font-weight="normal" font-family="system-ui,-apple-system,Segoe UI,sans-serif">identical to the</text><text x="667.0" y="350" font-size="12" fill="#eb6834" text-anchor="start" font-weight="normal" font-family="system-ui,-apple-system,Segoe UI,sans-serif">training target</text><rect x="70" y="590" width="740" height="100" rx="6" fill="#ffffff" stroke="#c3c2b7" stroke-width="1.5"/><text x="440.0" y="613" font-size="14" fill="#0b0b0b" text-anchor="middle" font-weight="600" font-family="system-ui,-apple-system,Segoe UI,sans-serif">Evaluation: the same 300 test problems for all</text><text x="440.0" y="634" font-size="12" fill="#52514e" text-anchor="middle" font-weight="normal" font-family="system-ui,-apple-system,Segoe UI,sans-serif">output: one numeric answer per problem</text><text x="440.0" y="653" font-size="12" fill="#52514e" text-anchor="middle" font-weight="normal" font-family="system-ui,-apple-system,Segoe UI,sans-serif">scored correct when the final number exactly matches the answer key</text><text x="440.0" y="672" font-size="12" fill="#898781" text-anchor="middle" font-weight="normal" font-family="system-ui,-apple-system,Segoe UI,sans-serif">recorded per run: accuracy  ·  mean output tokens  ·  latency</text></svg>