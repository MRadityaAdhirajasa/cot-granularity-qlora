I,sans-serif">tanpa training sama sekali</text><line x1="655.0" y1="240" x2="655.0" y2="588" stroke="#d95926" stroke-width="1.6" marker-end="url(#ac)"/><text x="667.0" y="316" font-size="12" fill="#d95926" text-anchor="start" font-weight="normal" font-family="system-ui,-apple-system,Segoe UI,sans-serif">prompt 4-shot, format</text><text x="667.0" y="333" font-size="12" fill="#d95926" text-anchor="start" font-weight="normal" font-family="system-ui,-apple-system,Segoe UI,sans-serif">sama persis dengan</text><text x="667.0" y="350" font-size="12" fill="#d95926" text-anchor="start" font-weight="normal" font-family="system-ui,-apple-system,Segoe UI,sans-serif">target training</text><rect x="70" y="590" width="740" height="100" rx="6" fill="#232322" stroke="#383835" stroke-width="1.5"/><text x="440.0" y="613" font-size="14" fill="#ffffff" text-anchor="middle" font-weight="600" font-family="system-ui,-apple-system,Segoe UI,sans-serif">Evaluasi — 300 soal test yang sama untuk semua</text><text x="440.0" y="634" font-size="12" fill="#c3c2b7" text-anchor="middle" font-weight="normal" font-family="system-ui,-apple-system,Segoe UI,sans-serif">output: satu jawaban berupa angka per soal</text><text x="440.0" y="653" font-size="12" fill="#c3c2b7" text-anchor="middle" font-weight="normal" font-family="system-ui,-apple-system,Segoe UI,sans-serif">dihitung benar bila angka akhirnya persis sama dengan kunci jawaban</text><text x="440.0" y="672" font-size="12" fill="#898781" text-anchor="middle" font-weight="normal" font-family="system-ui,-apple-system,Segoe UI,sans-serif">dicatat per run: akurasi  ·  rata-rata token output  ·  latensi</text></svg>