<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 714" role="img" aria-label="Alur eksperimen CoT distillation granularity di bawah QLoRA. Dataset GSM8K disubsample menjadi 1.455 soal train dan 300 soal test. Teacher Kimi K3 menghasilkan tiga tingkat kerincian rationale per soal, membentuk empat varian data training yang hanya berbeda panjang rationale-nya. Student Qwen3-0.6B dan 1.7B dilatih dengan QLoRA menjadi 14 adapter. Jalur terpisah mengevaluasi kedua student tanpa training sama sekali sebagai baseline. Keduanya dinilai pada 300 soal test yang sama dengan exact match jawaban numerik."><defs><marker id="an" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#898781"/></marker><marker id="ac" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d95926"/></marker><marker id="ai" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#3987e5"/></marker></defs><rect width="880" height="714" fill="#1a1a19"/><text x="440.0" y="34" font-size="16" fill="#ffffff" text-anchor="middle" font-weight="600" font-family="system-ui,-apple-system,Segoe UI,sans-serif">Alur eksperimen — CoT distillation granularity di bawah QLoRA</text><text x="440.0" y="54" font-size="12" fill="#898781" text-anchor="middle" font-weight="normal" font-family="system-ui,-apple-system,Segoe UI,sans-serif">apakah rationale yang lebih rinci menghasilkan student yang lebih akurat?</text><rect x="70" y="74" width="740" height="58" rx="6" fill="#232322" stroke="#383835" stroke-width="1.5"/><text x="440.0" y="98" font-size="15" fill="#ffffff" text-anchor="middle" font-weight="600" font-family="system-ui,-apple-system,Segoe UI,sans-serif">Dataset GSM8K — Grade School Math 8K</text><text x="440.0" y="118" font-size="12" fill="#c3c2b7" text-anchor="middle" font-